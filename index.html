const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const LS={g(k){try{return JSON.parse(localStorage.getItem("anq_"+k))}catch(e){return null}},s(k,v){try{localStorage.setItem("anq_"+k,JSON.stringify(v))}catch(e){}}};
const OKS={},PC={};QT.forEach(([t])=>OKS[t]=new Set(LS.g("ok"+t)||[]));
function pool(t){if(PC[t])return PC[t];const P=[];let i=0;HQ.split("\n").forEach(l=>{if(l.startsWith(t+"~")){const p=l.split("~");P.push({id:"h"+t+"-"+(i++),c:p[1],q:p[2],a:p[3],d:p.slice(4),g:[]})}});
const L=M.filter(m=>+m.p.split(":")[0]===t||(t===3&&m.n==="M. gastrocnemius"));
L.forEach(m=>[["v","Welcher Nerv versorgt "+m.n+"?"],["u","Wo liegt der Ursprung von "+m.n+"?"],["a","Wo liegt der Ansatz von "+m.n+"?"],["f","Welche Funktion hat "+m.n+"?"]].forEach(([k,q])=>{const u=x=>[...new Set(x.map(y=>y[k]).filter(v=>v!==m[k]))];P.push({id:"m"+M.indexOf(m)+k,c:"Muskeln",q,a:m[k],d:u(L),g:u(M)})}));return PC[t]=P}
function opts(q){let d=sh(q.d).slice(0,3);if(d.length<3)d=d.concat(sh(q.g.filter(x=>!d.includes(x)&&x!==q.a)).slice(0,3-d.length));return sh([q.a,...d])}
function draw(t){const P=pool(t),L=new Set(LS.g("last"+t)||[]),by={};CATS.forEach(c=>by[c]=sh(P.filter(q=>q.c===c)).sort((a,b)=>L.has(a.id)-L.has(b.id)));const o=[];let i=Math.random()*4|0;while(o.length<10&&CATS.some(c=>by[c].length)){const c=CATS[i++%4];if(by[c].length)o.push(by[c].shift())}return sh(o)}
const pct=t=>{const P=pool(t);return Math.round(100*P.filter(q=>OKS[t].has(q.id)).length/P.length)};
let S=null;const HINT='<p class="cap">Wähle links ein Quiz aus, um zu starten. Jedes Quiz enthält 10 zufällig gewählte Fragen aus dem Fragenpool des jeweiligen Skripts (Knochen &amp; Gelenke, Bänder, Muskeln, Palpation). Bei jedem Neustart werden neue Fragen gezogen.</p>';
function ql(){$("ql").innerHTML=QT.map(([t,n])=>`<button class="qi${S&&S.t===t?" on":""}" data-t="${t}"><b>Teil ${t} · ${E(n)}</b><span class="pb"><i style="width:${pct(t)}%"></i></span><small>Fortschritt: ${pct(t)} % · ${pool(t).length} Fragen im Pool</small></button>`).join("")}
function go(t){const qs=draw(t);LS.s("last"+t,qs.map(q=>q.id));S={t,qs:qs.map(q=>({...q,o:opts(q)})),i:0,sc:0,w:[],a:false};ql();rq()}
function rq(){const q=S.qs[S.i],n=S.qs.length,nm=QT.find(x=>x[0]===S.t)[1];
$("qm").innerHTML=`<p class="cnt">Teil ${S.t} · ${E(nm)} · Frage ${S.i+1} von ${n} · ${E(q.c)}</p><div class="pb"><i style="width:${S.i/n*100}%"></i></div><div class="card"><h3>${E(q.q)}</h3>${q.o.map((o,k)=>`<button class="op" data-k="${k}">${E(o)}</button>`).join("")}<p id="fb" class="cap"></p><button class="tg" id="nx" hidden>${S.i+1<n?"Weiter":"Ergebnis anzeigen"}</button></div>`;S.a=false}
function res(){const n=S.qs.length;$("qm").innerHTML=`<div class="card"><h3>Ergebnis: ${S.sc} von ${n} richtig</h3><p class="cap">Fortschritt in diesem Quiz: ${pct(S.t)} %</p>${S.w.length?"<p><b>Zum Wiederholen:</b></p>"+S.w.map(q=>`<p><b>${E(q.q)}</b><br><span class="cap">Richtig: ${E(q.a)}</span></p>`).join(""):"<p>Alles richtig!</p>"}<button class="tg" id="again">Neues Quiz mit neuen Fragen</button> <button class="tg" id="lst">Zur Quizliste</button></div>`;ql()}
$("ql").onclick=e=>{const b=e.target.closest(".qi");if(b)go(+b.dataset.t)};
$("qm").onclick=e=>{const b=e.target.closest("button");if(!b||!S)return;
if(b.id==="nx"){S.i++;S.i<S.qs.length?rq():res()}
else if(b.id==="again")go(S.t);
else if(b.id==="lst"){S=null;ql();$("qm").innerHTML=HINT}
else if(b.classList.contains("op")&&!S.a){S.a=true;const q=S.qs[S.i],ok=q.o[+b.dataset.k]===q.a;
document.querySelectorAll("#qm .op").forEach(x=>{if(q.o[+x.dataset.k]===q.a)x.classList.add("ok")});
if(ok)S.sc++;else{b.classList.add("no");S.w.push(q)}
if(ok&&!OKS[S.t].has(q.id)){OKS[S.t].add(q.id);LS.s("ok"+S.t,[...OKS[S.t]]);ql()}
$("fb").textContent=ok?"Richtig!":"Leider falsch. Richtig ist: "+q.a;$("nx").hidden=false}};

$("n1").onclick=()=>nv(1);$("n2").onclick=()=>nv(2);
ql();$("qm").innerHTML=HINT;
